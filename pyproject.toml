[tool.pytest.ini_options]
testpaths = ["statusline"]
# The timing budget is machine-dependent, so it runs only when asked: pytest -m timing
addopts = "-m 'not timing'"
markers = ["timing: measures the status line against its 150 ms budget"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting relies on bare assert, test tables use literal values, and the
# tests run git and the script by name and assert on the minus sign glyph.
"**/test_*.py" = ["S101", "S603", "S607", "PLR2004", "RUF001"]
